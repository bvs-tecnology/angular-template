<aside class="layout-sidebar" [class.layout-sidebar--closed]="!sidebarOpen()">
	<div class="layout-sidebar__header">
		<img
			class="layout-sidebar__logo"
			[class.hide-on-hover]="!sidebarOpen()"
			src="assets/svgs/logo_dark.svg"
			alt="logo" />
		<p-button
			[class.show-on-hover]="!sidebarOpen()"
			icon="pi pi-bars"
			text
			severity="secondary"
			size="small"
			(click)="toggleSidebar()"
			data-test="toggle-sidebar" />
	</div>

	<div class="layout-sidebar__menu">
		<p-panel-menu [model]="sidebarOpen() ? menuItems : menuItemsClose()">
			<ng-template #item let-item>
				<a class="p-panelmenu-header-link" [class.only-icon]="!sidebarOpen()">
					@if (item.icon) {
						<i class="p-panelmenu-header-icon {{ item.icon }}"></i>
					}
					@if (item.label) {
						<span class="p-panelmenu-header-label">{{ item.label | translate }}</span>
					}
				</a>
			</ng-template>
		</p-panel-menu>
	</div>

	<div class="spacer"></div>
	<p-divider class="divider" />
	<app-user [showAll]="sidebarOpen()" />
</aside>

<div class="layout-main" [class.sidebar-open]="sidebarOpen()">
	<router-outlet />
</div>
